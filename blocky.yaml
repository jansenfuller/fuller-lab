upstreams:
  strategy: parallel_best
  groups:
    default: 
      - tcp-tls:9.9.9.10
      - tcp-tls:149.112.112.10
      - tcp-tls:2620:fe::10
      - tcp-tls:2620:fe::fe:10
      - tcp-tls:194.242.2.2
      - tcp-tls:193.19.108.2
      - tcp-tls:2a07:e340::2
      - tcp-tls:fdns1.dismail.de:853
      - https://dns.digitale-gesellschaft.ch/dns-query
blocking:
  loading:
    refreshPeriod: 24h
  denylists:
    hagezi:
      # https://github.com/hagezi/dns-blocklists
      - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/pro.txt
      - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/tif.txt
      - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/fake.txt
    other:
      # https://firebog.net/
      - https://v.firebog.net/hosts/Easyprivacy.txt
      # Windows
      - https://raw.githubusercontent.com/crazy-max/WindowsSpyBlocker/master/data/hosts/spy.txt
      # Developer Dan: https://www.github.developerdan.com/hosts/
      - https://www.github.developerdan.com/hosts/lists/ads-and-tracking-extended.txt
      # https://oisd.nl/setup/blocky
      - https://big.oisd.nl/domainswild
  clientGroupsBlock:
    default:
      - hagezi
      - other
ports:
  dns: 5353
  tls: 20853
  https: 443
  http: 4000
customDNS:
  mapping:
    svr.ff.home: 10.12.30.2
caching:
  minTime: 5m
  maxTime: 2h
  prefetching: true
  exclude:
    - /.*\.lan$/
    - /.*\.home$/
    - /.*\.local$/
    - /.*\.host\.com\.(jp|fr)$/
queryLog:
  type: sqlite
  target: /app/usb/log.db
  logRetentionDays: 30
prometheus:
  enable: true
http3:
  enable: true
dnssec:
  validate: false
  clockSkewToleranceSec: 7200
