# unbound.conf — recursive validating resolver for RB5009UPr (RouterOS container)
# Deploy path (nlnetlabs/unbound image): /opt/unbound/etc/unbound/unbound.conf
#
# Stack architecture:
#   clients -> blocky  :5353 (filtering, unchanged for the network)
#           -> unbound :5354 (recursion + DNSSEC) -> root servers
# Clients keep pointing at blocky:5353 — zero client-side changes.
# Blocky's upstream group changes to this container's address:5354.
# One layer does DNSSEC validation: unbound (set blocky dnssec.validate: false).

server:
    # --- Listening ---
    interface: 0.0.0.0@5354          # recursion port; 5353 is blocky's (client-facing)
    do-ip4: yes
    do-ip6: no                       # RouterOS veth is IPv4-only; enable if you add IPv6
    do-udp: yes
    do-tcp: yes

    # --- Access control ---
    # Only blocky needs this port, but keep the LAN open for debugging:
    #   dig @10.12.10.1 -p 5354 example.com +dnssec
    # Tighten to 172.17.0.0/24 (container net) once proven if you prefer.
    access-control: 127.0.0.0/8 allow
    access-control: 10.12.0.0/16 allow
    access-control: 0.0.0.0/0 refuse

    # --- Recursion (no upstream provider in the path) ---
    qname-minimisation: yes          # send only the needed label per hop
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    aggressive-nsec: yes             # serve cached NSEC proofs; fewer upstream queries

    # --- DNSSEC (moved here from blocky; blocky validates=false) ---
    auto-trust-anchor-file: "/opt/unbound/etc/unbound/root.key"   # auto-managed
    val-log-level: 2                 # log validation failures; set 0 once proven

    # --- Caching (mirrors blocky caching: minTime 5m, maxTime 30m, prefetch) ---
    cache-min-ttl: 300
    cache-max-ttl: 1800
    cache-max-negative-ttl: 3600
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes               # serve stale while refreshing — resilience on a
    serve-expired-ttl: 86400         #   device that must never become a DNS SPOF
    rrset-cache-size: 32m            # ~48 MB total cache — right for 1 GB RAM + RouterOS
    msg-cache-size: 16m              # bump to 64m/32m if you have headroom
    msg-cache-slabs: 4
    rrset-cache-slabs: 4
    infra-cache-slabs: 4
    key-cache-slabs: 4

    # --- Local zones (mirrors blocky customDNS: svr.ff.home -> 10.12.30.2) ---
    local-zone: "ff.home." static
    local-data: "svr.ff.home. 3600 IN A 10.12.30.2"
    private-domain: "ff.home."        # never query upstream for it
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16

    # --- RB5009 performance/hardening ---
    num-threads: 2                    # leave CPU for RouterOS, firewall, CAPsMAN
    so-reuseport: yes
    edns-buffer-size: 1232
    max-udp-size: 1232                # DNS flag day 2020
    so-rcvbuf: 4m
    so-sndbuf: 4m
    do-not-query-localhost: yes
    rrset-roundrobin: yes
    minimal-responses: yes
    log-servfail: yes
    use-syslog: no                    # stderr -> captured by container logging=yes
    # log-queries: yes                # only while debugging — noisy
