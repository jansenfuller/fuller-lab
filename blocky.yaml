upstreams:
  strategy: parallel_best
  groups:
    default: 
      - 9.9.9.9
      - 149.112.112.112
      - 194.242.2.2
      - 194.242.2.3
      - tcp-tls:fdns1.dismail.de:853
      - https://dns.digitale-gesellschaft.ch/dns-query
blocking:
  loading:
    refreshPeriod: 1h
  denylists:
    ads: 
      - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
      - https://raw.githubusercontent.com/StevenBlack/hosts/master/alternates/fakenews-gambling-porn/hosts
  clientGroupsBlock:
    default:
      - ads
ports:
  dns: 5353
  tls: 20853
  https: 443
  http: 4000
customDNS:
  mapping:
    svr.ff.home: 10.12.30.2
caching:
  minTime: 5m
  maxTime: 30m
  prefetching: true
  exclude:
    - /.*\.lan$/
    - /.*\.local$/
    - /.*\.host\.com\.(jp|fr)$/
queryLog:
  type: sqlite
  target: /app/usb
  logRetentionDays: 30
prometheus:
  enable: true
http3:
  enable: true
dnssec:
  validate: true
  clockSkewToleranceSec: 7200